[project]
name = "tg-service"
version = "0.1.0"
description = "Telegram userbot parser: live listener, backfill jobs, HTTP API and MCP server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "telethon>=1.36",
    "asyncpg>=0.29",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "httpx[socks]>=0.27",
    "mcp>=1.2",
    "python-socks[asyncio]>=2.4",
]

[project.optional-dependencies]
media = [
    "mlx-whisper>=0.4",
    "pypdf>=5",
    "pypdfium2>=4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "sentence-transformers>=3",
    "pillow>=10",
]

[project.scripts]
tg-service = "tg_service.main:run"
tg-login = "tg_service.login:run"
tg-mcp = "tg_service.mcp_server:run"
tg-media-worker = "tg_service.media.worker:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tg_service"]
